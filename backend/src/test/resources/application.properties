spring.datasource.url=jdbc:h2:mem:perfumeria;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS a_perfumeria
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
spring.jpa.show-sql=false
frontend.url=http://localhost:5173

spring.config.import=optional:file:./local.properties,optional:file:./backend/local.properties